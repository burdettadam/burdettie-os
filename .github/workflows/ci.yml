name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (debug)
        run: cargo build --workspace --all-targets

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace

      - name: Rebuild fixtures
        run: |
          chmod +x scripts/build_fixtures.sh
          ./scripts/build_fixtures.sh

      - name: Bundle runtime
        run: |
          chmod +x packaging/bundle-runtime.sh
          ./packaging/bundle-runtime.sh --release

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-loader-bundle
          path: dist/
          retention-days: 14

  docker-dev:
    name: Docker Dev Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker build -f docker/Dockerfile.dev -t darwin-loader-dev .

      - name: Run checks in container
        run: |
          docker run --rm darwin-loader-dev
          docker run --rm darwin-loader-dev cargo test \
            -p platform-core -p macho-types -p macho-parse \
            -p macho-map -p macho-objc -p macho-resolve \
            -p macho-run-plan -p macho-diff -p trust-policy \
            -p macho-fixtures -p test-harness \
            --lib
