name: CI

on:
  push:
    branches: [main, chore/public-portfolio-prep]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.0

jobs:
  fixtures:
    name: Build native Mach-O fixtures
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build fixtures and corpus from source
        run: |
          bash scripts/build_fixtures.sh
          bash corpus/build_corpus.sh

      - name: Verify interpreter fixtures are present
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import re

          tests = Path("crates/macho-runtime/tests/interpreted_objc_tests.rs").read_text()
          names = set(re.findall(r'run_interpreted\("([^"]+)"\)', tests))
          assert names, "No interpreter fixture names found"
          missing = sorted(name for name in names if not any(
              (Path("fixtures") / name / binary).is_file()
              for binary in ("app", name)
          ))
          assert not missing, f"Missing interpreter fixtures: {missing}"
          print(f"Verified {len(names)} interpreter fixtures")
          PYFIX

      - name: Archive fixtures with executable modes and symlinks
        run: tar -czf "${RUNNER_TEMP}/native-fixtures.tar.gz" fixtures corpus

      - uses: actions/upload-artifact@v4
        with:
          name: native-macho-fixtures
          path: ${{ runner.temp }}/native-fixtures.tar.gz
          retention-days: 1

  check:
    name: Build & Test
    needs: fixtures
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-macho-fixtures
          path: ${{ runner.temp }}

      - name: Restore native fixtures
        run: tar -xzf "${RUNNER_TEMP}/native-fixtures.tar.gz"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (strict)
        run: |
          cargo clippy --locked --workspace --all-targets -- \
            -D warnings \
            -A clippy::unwrap-used \
            -A clippy::expect-used \
            -A clippy::cast-possible-truncation \
            -A clippy::cast-sign-loss \
            -A clippy::cast-possible-wrap \
            -A clippy::cast-lossless \
            -A clippy::ptr-as-ptr \
            -A clippy::print-stderr \
            -A clippy::redundant-closure-for-method-calls \
            -A clippy::implicit-clone

      - name: Build (debug)
        run: cargo build --locked --workspace --all-targets

      - name: Build (release)
        run: cargo build --locked --workspace --release

      - name: Test
        run: cargo test --locked --workspace

      - name: Bundle runtime
        run: |
          chmod +x packaging/bundle-runtime.sh
          ./packaging/bundle-runtime.sh --release

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: burdettie-os-bundle
          path: dist/
          retention-days: 14

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Install security tools
        run: |
          cargo install cargo-audit cargo-deny --locked

      - name: Dependency vulnerability scan (cargo-audit)
        run: cargo audit

      - name: Supply chain check (cargo-deny)
        run: cargo deny check

  docker-dev:
    name: Docker Dev Build
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-macho-fixtures
          path: ${{ runner.temp }}

      - name: Restore native fixtures
        run: tar -xzf "${RUNNER_TEMP}/native-fixtures.tar.gz"

      - name: Build dev image
        run: docker build -f docker/Dockerfile.dev -t burdettie-os-dev .

      - name: Run checks in container
        run: |
          docker run --rm burdettie-os-dev
          docker run --rm burdettie-os-dev cargo test --locked \
            -p platform-core -p macho-types -p macho-parse \
            -p macho-map -p macho-objc -p macho-resolve \
            -p macho-run-plan -p macho-diff -p trust-policy \
            -p macho-fixtures -p test-harness \
            --lib

  ffi-interop:
    name: FFI Interop (C + Swift)
    needs: fixtures
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-macho-fixtures
          path: ${{ runner.temp }}

      - name: Restore native fixtures
        run: tar -xzf "${RUNNER_TEMP}/native-fixtures.tar.gz"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Build FFI crate
        run: cargo build --locked --release -p darwin-runtime-ffi

      - name: Run FFI tests
        run: cargo test --locked -p darwin-runtime-ffi -- --test-threads=1

      - name: Install library to temp prefix
        run: |
          chmod +x packaging/install.sh
          ./packaging/install.sh --prefix /tmp/darwin-runtime-ci

      - name: Build and run C client
        run: |
          cc examples/c-client/test_darwin_runtime.c \
            -I/tmp/darwin-runtime-ci/include \
            -L/tmp/darwin-runtime-ci/lib \
            -ldarwin_runtime_ffi \
            -o /tmp/test_c_client
          /tmp/test_c_client

      - name: Build Swift package
        working-directory: swift
        run: swift build

      - name: Run Swift tests
        working-directory: swift
        env:
          DARWIN_LOADER_ROOT: ${{ github.workspace }}
        run: swift test

      - name: Build Swift client example
        working-directory: examples/swift-client
        run: swift build

  linux-arm64-e2e:
    name: Linux ARM64 E2E (Interpreter)
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-macho-fixtures
          path: ${{ runner.temp }}

      - name: Restore native fixtures
        run: tar -xzf "${RUNNER_TEMP}/native-fixtures.tar.gz"

      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Linux ARM64 E2E image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f docker/Dockerfile.linux-e2e \
            -t darwin-runtime-linux \
            --load .

      - name: Run interpreted fixture tests
        run: |
          docker run --rm darwin-runtime-linux
