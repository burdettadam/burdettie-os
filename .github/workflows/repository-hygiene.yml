name: Repository hygiene

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked artifacts
        run: python3 scripts/check_repository_hygiene.py
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable history for secrets
        shell: bash
        run: |
          set -euo pipefail
          report_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-report.XXXXXX")
          trap 'rm -rf -- "$report_dir"' EXIT
          scan_status=0
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner \
            --log-opts="--all" --report-format=json --report-path="$report_dir/report.json" . \
            || scan_status=$?
          summary_status=0
          python3 scripts/summarize_gitleaks.py "$report_dir/report.json" || summary_status=$?
          if (( scan_status != 0 )); then
            exit "$scan_status"
          fi
          exit "$summary_status"
