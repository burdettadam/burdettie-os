[package]
name        = "macho-exec"
description = "In-process Mach-O segment mapping, fixup application, and controlled entry"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[dependencies]
macho-types    = { workspace = true }
macho-parse    = { workspace = true }
macho-map      = { workspace = true }
macho-resolve  = { workspace = true }
macho-objc     = { workspace = true }
trust-policy   = { workspace = true }
runtime-diagnostics = { workspace = true }
platform-core  = { workspace = true }
arm64-translate = { workspace = true }
thiserror      = { workspace = true }
log            = { workspace = true }
libc           = { workspace = true }

[dev-dependencies]
macho-fixtures     = { workspace = true }
macho-run-plan     = { workspace = true }
serde_json         = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
platform-darwin-host = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
platform-linux       = { workspace = true }

[lints]
workspace = true
