[package]
name        = "macho-inspect"
description = "CLI tool for human-readable Mach-O binary inspection"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[[bin]]
name = "macho-inspect"
path = "src/main.rs"

[dependencies]
macho-types    = { workspace = true }
macho-parse    = { workspace = true }
macho-resolve  = { workspace = true }
macho-run-plan = { workspace = true }
macho-exec     = { workspace = true }
macho-objc     = { workspace = true }
macho-map      = { workspace = true }
# Direct paths permit opting out of workspace defaults on Rust 1.93.
macho-runtime  = { path = "../macho-runtime", default-features = false }
libsystem-shims = { workspace = true }
objc-runtime   = { workspace = true }
cf-lite        = { path = "../cf-lite", default-features = false }
runtime-diagnostics = { workspace = true }
platform-core  = { workspace = true }
trust-policy   = { workspace = true }
burdettie-domain-map  = { workspace = true }
burdettie-services    = { workspace = true }
burdettie-log-pipeline = { workspace = true }
window-backend-darwin = { workspace = true, optional = true }
clap           = { workspace = true }
serde_json     = { workspace = true }
serde          = { workspace = true }
env_logger     = { workspace = true }
log            = { workspace = true }

[features]
default = ["host-dialogs"]
host-dialogs = ["cf-lite/host-dialogs", "macho-runtime/host-dialogs"]
gui = ["host-dialogs", "dep:window-backend-darwin", "window-backend-darwin/guest-appkit"]

[target.'cfg(target_os = "macos")'.dependencies]
platform-darwin-host = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux       = { workspace = true }
libc                 = { workspace = true }

[lints]
workspace = true
