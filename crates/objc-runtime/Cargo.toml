[package]
name         = "objc-runtime"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[dependencies]
macho-objc          = { path = "../macho-objc" }
macho-parse         = { path = "../macho-parse" }
libsystem-shims     = { path = "../libsystem-shims" }
runtime-diagnostics = { workspace = true }
platform-core       = { workspace = true }
log                 = { workspace = true }
libc                = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
