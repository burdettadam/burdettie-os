[package]
name         = "objc-runtime"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[features]
default = []
## Use GNUstep libobjc2 as the ObjC runtime backend on Linux.
## Requires: apt-get install gnustep-libobjc2-dev (or build from source).
## Status: groundwork only — the trait boundary is defined but the FFI
## bindings are not yet implemented.
libobjc2 = []

[dependencies]
macho-objc          = { path = "../macho-objc" }
macho-parse         = { path = "../macho-parse" }
libsystem-shims     = { path = "../libsystem-shims" }
runtime-diagnostics = { workspace = true }
platform-core       = { workspace = true }
log                 = { workspace = true }
libc                = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
platform-darwin-host = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux       = { workspace = true }

[build-dependencies]
cc = "1"
[lints]
workspace = true
