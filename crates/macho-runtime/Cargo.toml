[package]
name         = "macho-runtime"
description  = "Runtime orchestration for burdettie-os — load, shim, and run Mach-O binaries"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[dependencies]
macho-types    = { workspace = true }
macho-parse    = { workspace = true }
macho-map      = { workspace = true }
macho-resolve  = { workspace = true }
macho-objc     = { workspace = true }
macho-exec     = { workspace = true }
arm64-translate = { workspace = true }
trust-policy   = { workspace = true }
libsystem-shims = { workspace = true }
objc-runtime   = { workspace = true }
# A direct path permits opting out of workspace defaults on Rust 1.93.
cf-lite        = { path = "../cf-lite", default-features = false }
cg-shims       = { workspace = true }
platform-core  = { workspace = true }
macho-shared-cache  = { workspace = true }
runtime-diagnostics = { workspace = true }
burdettie-domain-map = { workspace = true }
burdettie-services    = { workspace = true }
burdettie-log-pipeline = { workspace = true }
log            = { workspace = true }
libc           = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
sha2           = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
platform-darwin-host = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux       = { workspace = true }

[dev-dependencies]
macho-fixtures = { workspace = true }
objc-runtime   = { workspace = true }
env_logger     = { workspace = true }

[features]
default = ["host-dialogs"]
host-dialogs = ["cf-lite/host-dialogs"]

[lints]
workspace = true
