[package]
name        = "app-kit-lite"
description = "Application object, responder chain, and event types for burdettie-os GUI framework"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[dependencies]
runloop-core    = { workspace = true }
window-backend  = { workspace = true }
graphics-core   = { workspace = true }

[dependencies.arboard]
version = "3.6.1"
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.2.2", features = ["NSData", "NSString"] }

[features]
arboard = ["dep:arboard"]

[lints]
workspace = true
