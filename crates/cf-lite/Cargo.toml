[package]
name         = "cf-lite"
description  = "Foundation/CoreFoundation shims for burdettie-os"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[dependencies]
core-foundation-lite = { workspace = true }
libsystem-shims      = { workspace = true }
objc-runtime         = { workspace = true }
platform-core        = { workspace = true }
cg-shims             = { workspace = true }
graphics-core        = { workspace = true }
log                  = { workspace = true }
libc                 = { workspace = true }
regex                = { workspace = true }
serde_json           = { workspace = true }
ureq                 = { workspace = true }
plist                = { workspace = true }
quick-xml            = { workspace = true }
rusqlite             = { workspace = true }
cassowary            = { workspace = true }
arboard = { version = "3.6.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
platform-darwin-host = { workspace = true }
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux       = { workspace = true }

[build-dependencies]
cc = "1"

[lints]
workspace = true

[features]
arboard = ["dep:arboard"]
