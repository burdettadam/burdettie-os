[workspace]
resolver = "2"
members = [
    "crates/macho-types",
    "crates/macho-parse",
    "crates/macho-inspect",
    "crates/macho-map",
    "crates/macho-resolve",
    "crates/macho-objc",
    "crates/macho-run-plan",
    "crates/macho-diff",
    "crates/macho-fixtures",
    "crates/macho-exec",
    "crates/test-harness",
    "crates/trust-policy",
    "crates/libsystem-shims",
    "crates/objc-runtime",
    "crates/cf-lite",
    "crates/macho-runtime",
    "crates/platform-core",
    "crates/platform-darwin-host",
    "crates/platform-linux",
    "crates/runtime-demo",
    "crates/runtime-shell",
    "crates/runtime-diagnostics",
    "crates/graphics-core",
    "crates/window-backend",
    "crates/runloop-core",
    "crates/app-kit-lite",
    "crates/ui-view",
    "crates/ui-controls",
    "crates/window-backend-darwin",
    "crates/window-backend-linux",
    "crates/compat-runner",
    "crates/darwin-runtime-ffi",
    "crates/arm64-translate",
    "crates/perf-bench",
    "crates/libdispatch-sys",
    "crates/core-foundation-lite",
    "crates/cg-shims",
    "crates/icu-shims",
    "crates/macho-shared-cache",
    "crates/trust-eval",
    "crates/swift-stub-gen",
    "apps/hello-darwin",
    "apps/control-gallery",
    "apps/foundation-explorer",
]

[workspace.package]
version       = "0.1.0"
edition       = "2021"
license       = "MIT OR Apache-2.0"
rust-version  = "1.82"
repository    = "https://github.com/burdettadam/burdettie-os"
homepage      = "https://github.com/burdettadam/burdettie-os"
documentation = "https://github.com/burdettadam/burdettie-os/tree/main/docs"

[workspace.dependencies]
# Internal crates
macho-types    = { path = "crates/macho-types" }
macho-parse    = { path = "crates/macho-parse" }
macho-inspect  = { path = "crates/macho-inspect" }
macho-map      = { path = "crates/macho-map" }
macho-resolve  = { path = "crates/macho-resolve" }
macho-objc     = { path = "crates/macho-objc" }
macho-run-plan = { path = "crates/macho-run-plan" }
macho-diff     = { path = "crates/macho-diff" }
macho-fixtures = { path = "crates/macho-fixtures" }
macho-exec     = { path = "crates/macho-exec" }
test-harness   = { path = "crates/test-harness" }
trust-policy   = { path = "crates/trust-policy" }
libsystem-shims = { path = "crates/libsystem-shims" }
objc-runtime   = { path = "crates/objc-runtime" }
cf-lite         = { path = "crates/cf-lite" }
macho-runtime  = { path = "crates/macho-runtime" }
platform-core  = { path = "crates/platform-core" }
platform-darwin-host = { path = "crates/platform-darwin-host" }
platform-linux       = { path = "crates/platform-linux" }
runtime-demo   = { path = "crates/runtime-demo" }
runtime-shell  = { path = "crates/runtime-shell" }
runtime-diagnostics = { path = "crates/runtime-diagnostics" }
graphics-core  = { path = "crates/graphics-core" }
window-backend = { path = "crates/window-backend" }
runloop-core   = { path = "crates/runloop-core" }
app-kit-lite   = { path = "crates/app-kit-lite" }
ui-view        = { path = "crates/ui-view" }
ui-controls    = { path = "crates/ui-controls" }
window-backend-darwin = { path = "crates/window-backend-darwin" }
window-backend-linux  = { path = "crates/window-backend-linux" }
compat-runner         = { path = "crates/compat-runner" }
darwin-runtime-ffi    = { path = "crates/darwin-runtime-ffi" }
arm64-translate       = { path = "crates/arm64-translate" }
perf-bench            = { path = "crates/perf-bench" }
libdispatch-sys       = { path = "crates/libdispatch-sys" }
core-foundation-lite  = { path = "crates/core-foundation-lite" }
cg-shims              = { path = "crates/cg-shims" }
icu-shims             = { path = "crates/icu-shims" }
macho-shared-cache    = { path = "crates/macho-shared-cache" }
trust-eval            = { path = "crates/trust-eval" }
hello-darwin          = { path = "apps/hello-darwin" }
control-gallery       = { path = "apps/control-gallery" }
foundation-explorer   = { path = "apps/foundation-explorer" }

# External
bitflags  = "2"
thiserror = "2"
regex     = "1"
sha2      = "0.10"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
clap      = { version = "4", features = ["derive"] }
log       = "0.4"
env_logger = "0.11"
libc      = "0.2"
tempfile  = "3"
toml      = "0.8"
ureq      = { version = "3", features = ["rustls"] }
plist     = "1"
quick-xml = "0.37"

# ── Workspace-wide lints ────────────────────────────────────────────
# Inherited by every crate via `[lints] workspace = true`.
[workspace.lints.rust]
# Error handling & correctness
unused_must_use        = "deny"    # never silently drop Result / must_use
unreachable_patterns   = "warn"

[workspace.lints.clippy]
# ── Error handling (deny — these hide bugs) ──────────────────────
unwrap_used              = "warn"    # prefer expect(), ?, or unwrap_or
expect_used              = "warn"    # prefer ? or unwrap_or for recoverable paths

# ── Correctness & safety ────────────────────────────────────────
cast_possible_truncation = "warn"    # flag `as i32` etc. that may lose data
cast_sign_loss           = "warn"    # flag unsigned→signed cast surprises
cast_possible_wrap       = "warn"    # flag wrapping casts
cast_lossless            = "warn"    # prefer `from()` for guaranteed-safe casts
ptr_as_ptr               = "warn"    # prefer `cast::<T>()` over `as *const T`

# ── Style & clarity ────────────────────────────────────────────
manual_let_else          = "warn"    # prefer `let ... else { return }` pattern
needless_pass_by_value   = "warn"    # take &T when T is only read
manual_strip             = "warn"    # use str::strip_prefix instead of slicing
new_without_default      = "warn"    # impl Default when you have fn new()
redundant_else           = "warn"    # remove else after diverging if
cloned_instead_of_copied = "warn"    # prefer .copied() on Copy types
vec_init_then_push       = "warn"    # prefer vec![] macro
identity_op              = "warn"    # operations that have no effect
unnecessary_cast         = "warn"    # remove casts to same type
fn_to_numeric_cast       = "warn"    # prefer `as usize` for function pointers
implicit_clone           = "warn"    # prefer explicit .clone()
redundant_closure_for_method_calls = "warn"  # prefer method ref over closure

# ── Deny — hard errors in CI ───────────────────────────────────
dbg_macro                = "deny"    # no debug prints in committed code
print_stderr             = "warn"    # prefer log::warn! over eprintln! where possible
